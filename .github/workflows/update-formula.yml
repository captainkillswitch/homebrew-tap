name: Update formula

# Zero-secret tap updates: instead of the app repo pushing here with a PAT,
# this workflow PULLS the public release manifest that cli-release.yml
# publishes to captainkillswitch.github.io/downloads/cli/ and regenerates
# Formula/cks.rb from it. Pushing to our own repo only needs the built-in
# GITHUB_TOKEN (permissions: contents: write below) — no HOMEBREW_TAP_TOKEN.
#
# Formula URLs are the IMMUTABLE per-version assets on the downloads repo's
# cli-vX.Y.Z GitHub Release (manifest.json's "release" + "assets", published
# by cli-release.yml BEFORE the manifest goes live) — same fix as the cask's
# #1. The Pages files (cli/cks-macos, …) are replaced by every CLI publish
# while this formula still pins the previous sha256, so pointing at them
# broke `brew install cks` until the next run. A versioned URL never changes
# under its pinned sha: the formula just lags. Manifests published before the
# mirror existed (<= 0.1.4) have no "release" field and keep the old URLs.
#
# Hourly (free: public repo) because the app repo has no token that can
# dispatch this; after cutting a CLI release you can also trigger it
# immediately:  gh workflow run update-formula.yml -R captainkillswitch/homebrew-tap

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # hourly — picks up releases automatically

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Regenerate Formula/cks.rb from the published manifest
        run: |
          set -euo pipefail
          MANIFEST_URL="https://captainkillswitch.github.io/downloads/cli/manifest.json"

          # Nothing published yet (first release hasn't run) — succeed quietly.
          if ! curl -fsSL "$MANIFEST_URL" -o /tmp/manifest.json; then
            echo "ℹ️ No CLI manifest at $MANIFEST_URL yet — nothing to do."
            exit 0
          fi

          VERSION=$(jq -er .version /tmp/manifest.json)
          SHA_MAC=$(jq -er '.sha256["macos-universal"]' /tmp/manifest.json)
          SHA_LINUX=$(jq -er '.sha256["linux-x64"]' /tmp/manifest.json)

          # Guard: refuse to write a formula with empty/garbage digests.
          for v in "$VERSION" "$SHA_MAC" "$SHA_LINUX"; do
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "❌ Manifest is missing version or sha256 fields." >&2
              exit 1
            fi
          done
          if ! echo "$SHA_MAC$SHA_LINUX" | grep -qE '^[0-9a-f]{128}$'; then
            echo "❌ sha256 fields are not two 64-char hex digests." >&2
            exit 1
          fi

          RELEASE=$(jq -r '.release // empty' /tmp/manifest.json)
          if [ -n "$RELEASE" ]; then
            case "$RELEASE" in
              "https://github.com/captainkillswitch/downloads/releases/download/cli-v${VERSION}") ;;
              *) echo "❌ manifest release '$RELEASE' is not the cli-v${VERSION} mirror." >&2; exit 1 ;;
            esac
            ASSET_MAC=$(jq -er '.assets["macos-universal"]' /tmp/manifest.json)
            ASSET_LINUX=$(jq -er '.assets["linux-x64"]' /tmp/manifest.json)
            for a in "$ASSET_MAC" "$ASSET_LINUX"; do
              if ! echo "$a" | grep -qE "^cks-${VERSION//./\\.}-[a-z0-9_-]+$"; then
                echo "❌ manifest asset name '$a' is not cks-${VERSION}-<platform>." >&2
                exit 1
              fi
            done
            # Pin only bytes we've actually fetched from the immutable URL and
            # that match the manifest. If they aren't downloadable yet, keep the
            # current formula (still installable) and let the next run move it.
            for pair in "$ASSET_MAC $SHA_MAC" "$ASSET_LINUX $SHA_LINUX"; do
              asset=${pair% *}; want=${pair#* }
              if ! curl -fsSL "$RELEASE/$asset" -o "/tmp/$asset"; then
                echo "ℹ️ $RELEASE/$asset not downloadable yet — keeping the current formula."
                exit 0
              fi
              got=$(sha256sum "/tmp/$asset" | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                echo "❌ $asset hashes to $got but manifest.json says $want." >&2
                exit 1
              fi
            done
            URL_MAC="$RELEASE/$ASSET_MAC"
            URL_LINUX="$RELEASE/$ASSET_LINUX"
          else
            # Legacy manifest (no mirror): the mutable Pages URLs, as before.
            URL_MAC="https://captainkillswitch.github.io/downloads/cli/cks-macos"
            URL_LINUX="https://captainkillswitch.github.io/downloads/cli/cks-linux"
          fi

          mkdir -p Formula
          # The formula installs the prebuilt binaries (macOS universal, Linux
          # x64 musl) that the manifest's digests were computed from. OS.mac?
          # rather than on_macos/on_linux blocks: brew style rejects url/sha256
          # inside those, and there is exactly one artifact per OS. Homebrew
          # stages a bare-file download under its URL basename (cks-*).
          cat > Formula/cks.rb <<EOF
          class Cks < Formula
            desc "Force-quit every running GUI application (Captain Kill Switch)"
            homepage "https://captainkillswitch.com"
            license "MIT"

            if OS.mac?
              url "${URL_MAC}"
              sha256 "${SHA_MAC}"
            else
              url "${URL_LINUX}"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install Dir["cks-*"].first => "cks"
            end

            test do
              assert_match "cks", shell_output("#{bin}/cks --help")
            end
          end
          EOF
          # Versioned URLs carry the version, so they need no `version` stanza
          # (brew audit: "redundant with version scanned from URL"); the legacy
          # unversioned Pages URLs do.
          if [ -z "$RELEASE" ]; then
            awk -v v="$VERSION" '{ print } /^  homepage / { print "  version \"" v "\"" }' \
              Formula/cks.rb > Formula/cks.rb.tmp
            mv Formula/cks.rb.tmp Formula/cks.rb
          fi

          if git diff --quiet -- Formula/cks.rb && [ -n "$(git ls-files Formula/cks.rb)" ]; then
            echo "ℹ️ Formula already at ${VERSION} — nothing to commit."
            exit 0
          fi

          # Identity on the CONFIG so the rebase below can commit too.
          git config user.name "CKS Release Bot"
          git config user.email "release-bot@captainkillswitch.invalid"
          git add Formula/cks.rb
          git commit -q -m "cks ${VERSION}"
          # update-cask.yml pushes to the same branch on its own schedule —
          # rebase once so an interleaved cask commit can't fail the push.
          git pull --rebase -q origin main
          git push origin HEAD:main
          echo "✅ Formula updated to cks ${VERSION}"
